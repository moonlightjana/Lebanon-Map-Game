<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THE LEVANT · بلاد الشام</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
body[data-th=lv]{--c1:#150f33;--c2:#34267a;--ac:#f2b84b;--bt:#20143f;--cd:#fff3d6}
body[data-th=lb]{--c1:#0a3220;--c2:#17703f;--ac:#ed1c24;--bt:#fff;--cd:#fff6dc}
body[data-th=sy]{--c1:#0b1f45;--c2:#2457a3;--ac:#e8c26a;--bt:#1b1405;--cd:#f4f8ff}
body[data-th=ps]{--c1:#380d11;--c2:#a82a31;--ac:#8fa63c;--bt:#fff;--cd:#fff4ee}
body[data-th=jo]{--c1:#381809;--c2:#b4552a;--ac:#f0b35c;--bt:#3a1a0a;--cd:#fff2dc}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI",Tahoma,system-ui,sans-serif;color:#fff;background:var(--c1)}
.ttl{font-family:"Cormorant Garamond",Georgia,serif;letter-spacing:.05em;font-weight:700}
[dir=rtl] .ttl{font-family:"Amiri",Georgia,serif;letter-spacing:0}
#stage{position:fixed;inset:0;background:#1d3f73}
#map{width:100%;height:100%;display:block;overflow:visible;touch-action:none;cursor:crosshair;direction:ltr;transition:opacity .8s}
#map.shake{animation:shake .45s}
.leb{filter:drop-shadow(0 5px 9px rgba(0,0,0,.4))}
.hidden{display:none!important}
.btn{font:inherit;font-weight:800;border:0;border-radius:16px;padding:14px 28px;font-size:1.05rem;cursor:pointer;color:var(--bt);background:var(--ac);box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .2s,box-shadow .2s,opacity .3s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.4)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.alt{background:var(--c2);color:#fff}
.btn.sm{padding:8px 14px;font-size:.88rem;border-radius:12px;box-shadow:none}
.pill{background:rgba(10,12,30,.8);backdrop-filter:blur(6px);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:8px 14px;font:inherit;font-weight:800;font-size:.92rem;cursor:pointer}
button.pill:hover{background:var(--c2)}
#hud{position:absolute;top:24px;inset-inline-start:18px;display:flex;gap:8px;z-index:5;animation:fade .8s both}
#ctl{position:absolute;top:24px;inset-inline-end:18px;display:flex;gap:8px;align-items:center;z-index:12}
#vol{width:70px;accent-color:var(--ac)}
#timer{position:absolute;top:22px;left:50%;transform:translateX(-50%);z-index:5;width:240px;text-align:center;background:rgba(10,12,30,.86);border:2px solid rgba(255,255,255,.3);border-radius:18px;padding:6px 14px 10px;animation:fade .5s both}
#timer b{display:block;font-size:2.1rem;line-height:1.1;font-variant-numeric:tabular-nums}
#timer .bar{height:12px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden}
#timer .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3ddc84,#c8e64a);border-radius:8px;transition:width .1s linear}
#timer.low{border-color:#ff3b3b;animation:pulse .6s infinite}
#timer.low b{color:#ff4a4a}
#timer.low .bar i{background:linear-gradient(90deg,#ff3b3b,#ff7a45)}
.card{background:var(--cd);color:#1a1a1a;border-radius:20px;box-shadow:0 12px 34px rgba(0,0,0,.4);overflow:hidden;position:relative}
.card::before{content:"";display:block;height:7px;background:linear-gradient(90deg,var(--c2),var(--ac),var(--c2))}
#chal{position:absolute;top:84px;inset-inline-start:18px;z-index:4;width:250px;text-align:center;padding:0 14px 14px;animation:flip .7s both}
#chal small{display:block;margin-top:10px;letter-spacing:2px;text-transform:uppercase;font-size:.7rem;color:var(--c2);font-weight:800}
#chal h2{margin:2px 0 4px;font-size:2.1rem;color:var(--c2);line-height:1.1}
#chal .fl{position:absolute;top:16px;inset-inline-end:10px;width:34px;border-radius:4px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.4)}
#hints{list-style:none;margin:6px 0;padding:0;text-align:start;font-size:.88rem;line-height:1.4}
#hints li{background:rgba(0,0,0,.06);border-radius:10px;padding:6px 9px;margin-top:6px;animation:slide .5s both}
.side{position:absolute;top:84px;inset-inline-end:18px;width:340px;max-height:calc(100% - 170px);overflow:auto;z-index:8;animation:slide .6s both}
.tile{height:120px;display:flex;align-items:center;justify-content:center;font-size:3.6rem;position:relative}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fb{padding:14px 18px 18px}
.fb h3{margin:0;font-size:1.5rem;color:var(--c2)}
.verdict{display:inline-block;font-weight:900;padding:3px 12px;border-radius:999px;color:#fff;margin-bottom:6px}
.verdict.ok{background:#1f9d55;animation:pop .6s}.verdict.no{background:#d97a1a}
.dist{margin:2px 0 10px;font-weight:700;color:var(--c2)}
.did{font-size:.75rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--c2);font-weight:800}
.fb p{margin:4px 0 0;line-height:1.55}
.nt{display:block;width:150px;margin:10px auto 0;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.35);animation:drop .7s cubic-bezier(.3,1.5,.5,1) both}
.ntv{text-align:center;font-weight:900;color:#1f9d55;margin-top:4px}
.stack{position:relative;height:104px;margin:8px 0 4px}
.stack img{position:absolute;width:196px;border-radius:5px;box-shadow:0 3px 8px rgba(0,0,0,.35);animation:drop .7s cubic-bezier(.3,1.5,.5,1) both}
.bignum{font-size:4rem;font-weight:900;color:var(--c2);animation:pop .9s;line-height:1}
.bignum small{font-size:2rem;opacity:.7}
#acts{position:absolute;bottom:30px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:5;pointer-events:none}
#acts>*{pointer-events:auto}
#acts .row{display:flex;gap:10px}
#zoom{position:absolute;bottom:30px;inset-inline-start:18px;display:flex;flex-direction:column;gap:6px;z-index:6}
#zoom button{width:44px;height:44px;font-size:1.3rem;padding:0;display:flex;align-items:center;justify-content:center}
#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:#d33;padding:12px 22px;border-radius:14px;font-weight:800;z-index:13;opacity:0;pointer-events:none;transition:.3s;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#frame{position:absolute;inset:0;pointer-events:none;z-index:2}
#frame i{position:absolute;background:var(--c1) var(--pat) repeat;opacity:.95}
#frame .t,#frame .b{left:0;right:0;height:16px;background-size:auto 100%}
#frame .t{top:0}#frame .b{bottom:0}
#frame .l,#frame .r{top:0;bottom:0;width:11px;background-size:100% auto}
#frame .l{left:0}#frame .r{right:0}
.cn{position:absolute;width:min(20vw,140px);height:min(20vw,140px);pointer-events:none}
.cn.tl{top:14px;left:10px}.cn.tr{top:14px;right:10px;transform:scaleX(-1)}.cn.bl{bottom:18px;left:10px;transform:scaleY(-1)}.cn.br{bottom:18px;right:10px;transform:scale(-1,-1)}
.ov{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:34px 22px;overflow:auto;animation:fade .8s both}
#intro{background:radial-gradient(ellipse at 30% 20%,#3b2a7a 0,#150f33 60%),#150f33;z-index:9}
#select{background:radial-gradient(ellipse at 70% 10%,#34267a 0,#150f33 65%);z-index:9;flex-direction:column;gap:20px}
#splash{background:radial-gradient(circle,rgba(0,0,0,.35),rgba(0,0,0,.78));backdrop-filter:blur(3px)}
.ib{display:flex;gap:34px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:1000px;position:relative;z-index:2}
.it{text-align:center}
.it .big{font-size:clamp(2.6rem,7vw,4.6rem);line-height:1;color:#fff;text-shadow:0 4px 24px rgba(242,184,75,.45)}
.it .big2{font-size:clamp(2.4rem,6vw,4rem);color:#f2b84b;line-height:1.3;font-family:"Amiri",Georgia,serif;letter-spacing:0}
.it p{opacity:.8;margin:10px 0 22px}
#imap{width:min(440px,80vw);height:auto;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.5);border:2px solid rgba(242,184,75,.5)}
#imap path.cn1{animation:pop 1s both;transform-box:fill-box;transform-origin:center}
#select h2{margin:0;font-size:clamp(1.8rem,5vw,2.8rem);text-align:center;position:relative;z-index:2}
#select p{margin:0;opacity:.8;text-align:center;position:relative;z-index:2}
#cards{display:grid;grid-template-columns:repeat(4,minmax(0,210px));gap:18px;justify-content:center;position:relative;z-index:2}
.cc{font:inherit;color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:22px;padding:14px 14px 18px;cursor:pointer;text-align:center;background:linear-gradient(160deg,var(--k1),var(--k2));box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,opacity .4s,filter .4s;animation:slide .7s both}
.cc:hover{transform:translateY(-10px) scale(1.03);box-shadow:0 18px 44px var(--k2)}
.cc .fl{width:64px;margin:0 auto 8px;border-radius:5px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.cc .mo{width:100%;height:auto;border-radius:12px;background:rgba(255,255,255,.1)}
.cc .nm{font-size:1.9rem;margin-top:8px;line-height:1.1}
.cc .tg{opacity:.85;font-size:.88rem;margin-top:4px}
#cards.pick .cc{opacity:.25;filter:grayscale(.6);pointer-events:none}
#cards.pick .cc.sel{opacity:1;filter:none;transform:scale(1.1);box-shadow:0 0 0 3px #fff,0 20px 50px var(--k2)}
.sp{text-align:center;max-width:400px;width:100%;padding:0 22px 26px;animation:flip .8s both}
.sp .fl{width:100px;margin:20px auto 8px;border-radius:8px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.sp h2{font-size:3.2rem;margin:0;color:var(--c2);line-height:1.1}
.sp p{margin:6px 0 16px;color:#333}
#cinema{position:absolute;inset:0;z-index:15;background:#02040f;transition:opacity 1s ease}
#cinema canvas{position:absolute;inset:0;width:100%;height:100%}
#cap{position:absolute;bottom:14%;left:0;right:0;text-align:center;font-size:1.25rem;font-weight:700;letter-spacing:3px;text-shadow:0 2px 12px #000;opacity:0;transition:opacity .6s;padding:0 12px}
#cap.last{font-size:clamp(2rem,6vw,3.4rem);letter-spacing:6px}
#skip{position:absolute;bottom:18px;right:16px;z-index:16}
#cheer{position:absolute;inset:0;z-index:11;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:20px}
#cheer span{font-size:clamp(3.2rem,14vw,9rem);font-weight:900;color:#fff;text-shadow:0 0 40px #ffc93c,0 0 80px var(--ac),0 8px 0 var(--c2);animation:cheer 3.2s cubic-bezier(.3,.7,.3,1) both}
#conf{position:absolute;inset:0;pointer-events:none;z-index:7}
.pinp{animation:drop .45s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:bottom center}
.wob{animation:wob 1.2s .4s ease-in-out 2;transform-box:fill-box;transform-origin:bottom center}
.truep{animation:pop .6s .4s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:bottom center}
.ring{fill:none;stroke:#ffc93c;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out 3 both}
.spark{transform-box:fill-box;transform-origin:center;animation:spark 1.1s .5s ease-out both}
.line{stroke:#ffc93c;stroke-width:3.5;stroke-dasharray:9 8;vector-effect:non-scaling-stroke;animation:fade .6s .2s both}
.lbl{font-weight:800;fill:#1a1a1a;paint-order:stroke;stroke:#fff6dc;stroke-width:4;font-size:17px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes flip{from{opacity:0;transform:rotateX(70deg) translateY(-10px)}to{opacity:1;transform:none}}
@keyframes drop{from{transform:translateY(-50px) scale(.6);opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(9);opacity:0}}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.05)}}
@keyframes cheer{0%{opacity:0;transform:scale(.7)}22%{opacity:1;transform:scale(1)}85%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.18)}}
@media(max-width:820px){#cards{grid-template-columns:repeat(2,minmax(0,170px))}.cc .nm{font-size:1.5rem}}
@media(max-width:720px){
 #hud{top:22px;inset-inline-start:12px}#ctl{top:22px;inset-inline-end:12px;gap:5px}#vol{width:46px}
 #ctl .pill{padding:7px 10px;font-size:.8rem}
 #timer{top:64px;width:200px}
 #chal{top:118px;inset-inline-start:0;inset-inline-end:0;margin:auto;width:230px}
 #chal h2{font-size:1.6rem}
 .side{top:auto;bottom:86px;inset-inline:10px;width:auto;max-height:46%}.tile{height:70px;font-size:2.4rem}
 #zoom{bottom:auto;top:118px;inset-inline-start:10px}#zoom button{width:38px;height:38px}
 #acts{bottom:26px}
 .cn{width:70px;height:70px}
}
</style>
</head>

lb:{id:'lb',n:['Lebanon','لبنان'],tg:['Land of the Cedars','بلد الأرز'],coast:LCOAST,land:LLAND,seas:[MED],lakes:[],rivers:[],g:[[0,'#f2e5bc'],[1,'#e2cb93']],gd:[0,0,1,1],cur:{n:['Lebanese Lira','ليرة لبنانية'],v:10},th:['#0a3220','#17703f'],
 cities:[
 city('beirut',33.8938,35.5018,'🌆',['Beirut','بيروت'],[['This city sits on a headland jutting into the Mediterranean on the central coast.','تقع هذه المدينة على رأس بري يمتد في المتوسط على الساحل الأوسط.'],['It is Lebanon’s capital and its largest city.','هي عاصمة لبنان وأكبر مدنه.']],['Beirut has been destroyed and rebuilt many times in its 5,000-year history, and layers of Phoenician, Roman and Ottoman life lie beneath the modern city.','دُمّرت بيروت وأُعيد بناؤها مرات عديدة خلال تاريخها الممتد نحو خمسة آلاف عام، وتحت المدينة الحديثة طبقات من العصور الفينيقية والرومانية والعثمانية.']),
 city('tripoli',34.4367,35.8497,'🍬',['Tripoli','طرابلس'],[['This city is on the northern coast, built around a pointed peninsula with islands offshore.','تقع هذه المدينة على الساحل الشمالي حول شبه جزيرة مدببة قبالتها جزر.'],['It is Lebanon’s second-largest city, known for its Mamluk old town and sweets.','هي ثاني أكبر مدن لبنان، وتشتهر ببلدتها القديمة المملوكية وحلوياتها.']],['Lebanon’s second-largest city is famous for its Mamluk architecture and its Arabic sweets, which draw visitors from every region.','ثاني أكبر مدن لبنان، تشتهر بعمارتها المملوكية وبحلويّاتها العربية التي يقصدها الزوّار من كل المناطق.']),
 city('byblos',34.1208,35.6481,'📜',['Byblos','جبيل'],[['This ancient harbor town is on the coast roughly 40 km north of the capital.','هذه البلدة المرفئية القديمة على الساحل على بعد نحو 40 كم شمال العاصمة.'],['Its ancient Greek name gave us the word “Bible”.','اسمها اليوناني القديم أعطانا كلمة «Bible».']],['One of the oldest continuously inhabited cities in the world. The word “Bible” comes from its ancient Greek name, because papyrus was traded through its port.','من أقدم المدن المأهولة باستمرار في العالم، وكلمة «Bible» مشتقة من اسمها اليوناني القديم لأن البردي كان يُتاجَر به عبر مرفئها.']),
 city('baalbek',34.0047,36.2110,'🏛️',['Baalbek','بعلبك'],[['This city is inland, in the northern Bekaa Valley, far from the sea.','هذه المدينة في الداخل، في شمال سهل البقاع، بعيدًا عن البحر.'],['Giant Roman temples, including the Temple of Jupiter, stand here.','تقوم فيها معابد رومانية ضخمة، منها معبد جوبيتر.']],['Its Roman Temple of Jupiter has some of the largest columns of the ancient world, and some of its stone blocks weigh hundreds of tons.','في بعلبك معبد جوبيتر الروماني بأعمدة من بين الأضخم في العالم القديم، وتزن بعض كتله الحجرية مئات الأطنان.']),
 city('zahle',33.8463,35.9020,'🍇',['Zahle','زحلة'],[['This city sits at the foot of Mount Lebanon, on the western edge of the Bekaa Valley.','تقع هذه المدينة عند سفح جبل لبنان، على الحافة الغربية لسهل البقاع.'],['It is nicknamed the “Bride of the Bekaa”.','تُلقَّب بـ«عروس البقاع».']],['Nicknamed the “Bride of the Bekaa”, Zahle is famed for arak and for riverside restaurants along the Berdawni.','تُلقَّب زحلة بـ«عروس البقاع»، وتشتهر بالعرق وبمطاعمها على ضفاف نهر البردوني.']),
 city('sidon',33.5631,35.3689,'🏰',['Sidon','صيدا'],[['This port city is on the southern coast, about 40 km south of Beirut.','هذه المدينة المرفئية على الساحل الجنوبي، على بعد نحو 40 كم جنوب بيروت.'],['A Crusader sea castle stands on a small island joined to its shore.','تقف قلعة صليبية بحرية على جزيرة صغيرة تتصل بشاطئها.']],['Sidon’s Sea Castle was built by the Crusaders in the 13th century on a small island joined to the shore by a stone causeway.','بنى الصليبيون قلعة صيدا البحرية في القرن الثالث عشر على جزيرة صغيرة تتصل باليابسة بجسر حجري.']),
 city('tyre',33.2733,35.1939,'🐚',['Tyre','صور'],[['This city is on a coastal peninsula near the far southern end of Lebanon.','هذه المدينة على شبه جزيرة ساحلية قرب أقصى جنوب لبنان.'],['It was a great Phoenician city, famed for its purple dye.','كانت مدينة فينيقية عظيمة اشتهرت بصبغتها الأرجوانية.']],['Ancient Tyre was a Phoenician power that gave the world Tyrian purple, a royal dye made from sea snails. It is now a UNESCO World Heritage site.','كانت صور قوة فينيقية قديمة أعطت العالم الأرجوان الصوري المستخرج من القواقع البحرية، وهي اليوم موقع تراث عالمي لليونسكو.']),
 city('bcharri',34.2500,36.0167,'🌲',['Bcharri','بشرّي'],[['This mountain town lies in the north, perched above a deep valley.','هذه البلدة الجبلية في الشمال، تتربع فوق وادٍ عميق.'],['It is the birthplace of the poet Khalil Gibran, near the Cedars of God.','هي مسقط رأس الشاعر جبران خليل جبران، قرب أرز الربّ.']],['Hometown of the poet Khalil Gibran, author of The Prophet, it sits near the Cedars of God in the Qadisha Valley.','مسقط رأس الشاعر جبران خليل جبران صاحب «النبي»، وتقع قرب أرز الربّ في وادي قاديشا.'])]},
sy:{id:'sy',n:['Syria','سوريا'],tg:['Land of Jasmine','بلد الياسمين'],coast:SCOAST,land:SLAND,seas:[MED],lakes:[],rivers:[EUPH],g:[[0,'#d6dba6'],[.5,'#e6dcaa'],[1,'#ecd6a0']],gd:[0,0,1,.3],cur:{n:['Syrian Lira','ليرة سورية'],v:5},th:['#0b1f45','#2457a3'],
 cities:[
 city('damascus',33.5138,36.2765,'🕌',['Damascus','دمشق'],[['This city lies in the southwest, inland in a green oasis at the foot of Mount Qasioun.','تقع هذه المدينة في الجنوب الغربي في واحة خضراء عند سفح جبل قاسيون.'],['It is the capital, famed for jasmine, Damascene steel and the Umayyad Mosque.','هي العاصمة، وتشتهر بالياسمين والفولاذ الدمشقي والجامع الأموي.']],['Damascus is often called one of the world’s oldest continuously inhabited cities, with the Umayyad Mosque and the Souq al-Hamidiyya at its heart.','تُعدّ دمشق من أقدم المدن المأهولة باستمرار في العالم، وفي قلبها الجامع الأموي وسوق الحميدية.']),
 city('aleppo',36.2021,37.1343,'🏰',['Aleppo','حلب'],[['This big city is in the north, not far from the Turkish border, on a plateau.','هذه المدينة الكبيرة في الشمال، ليست بعيدة عن الحدود التركية، على هضبة.'],['It is famed for its ancient citadel and its covered souks.','تشتهر بقلعتها العريقة وأسواقها المسقوفة.']],['Aleppo’s medieval citadel rises from a huge mound, its covered souks are among the longest in the world, and Aleppo laurel soap is famous.','ترتفع قلعة حلب من تلّ ضخم، وأسواقها المسقوفة من أطول أسواق العالم، ويشتهر صابون الغار الحلبي.']),
 city('latakia',35.5317,35.7900,'⚓',['Latakia','اللاذقية'],[['This is Syria’s main port, on the Mediterranean coast in the northwest.','هذا هو المرفأ الرئيسي لسوريا، على ساحل المتوسط في الشمال الغربي.'],['Ugarit, home to one of the earliest alphabets, lies just to its north.','تقع أوغاريت، موطن أحد أقدم الأبجديات، إلى شمالها مباشرة.']],['Latakia is Syria’s main port; nearby Ugarit gave the world one of the earliest alphabets, around 1400 BCE.','اللاذقية هي مرفأ سوريا الرئيسي، وقربها أوغاريت التي أعطت العالم أحد أقدم الأبجديات نحو عام 1400 ق.م.']),
 city('homs',34.7324,36.7137,'🏰',['Homs','حمص'],[['This city lies in central Syria, on the Orontes river, in a gap between mountain ranges.','تقع هذه المدينة في وسط سوريا، على نهر العاصي، في فتحة بين سلسلتين جبليتين.'],['The Crusader castle Krak des Chevaliers stands in the hills nearby.','تقف قلعة الحصن الصليبية في التلال القريبة.']],['Homs sits near the Homs Gap, the main passage between the coast and the interior, and Krak des Chevaliers stands in the hills to its west.','تقع حمص قرب فتحة حمص، المعبر الرئيسي بين الساحل والداخل، وتقف قلعة الحصن في التلال غربها.']),
 city('palmyra',34.5536,38.2845,'🏛️',['Palmyra','تدمر'],[['This ruined oasis city lies in the middle of the Syrian Desert, in the center-east.','تقع هذه المدينة الأثرية الواحية في قلب البادية السورية، في الوسط الشرقي.'],['Queen Zenobia ruled from here, and the Temple of Bel stands among its ruins.','حكمت الملكة زنوبيا من هنا، ويقف معبد بل بين أطلالها.']],['Palmyra was a wealthy caravan city on the Silk Road; Queen Zenobia challenged Rome from here in the 3rd century CE.','كانت تدمر مدينة قوافل غنية على طريق الحرير، ومنها تحدّت الملكة زنوبيا روما في القرن الثالث الميلادي.']),
 city('deir',35.3359,40.1408,'🌊',['Deir ez-Zor','دير الزور'],[['This city is in the east, on the banks of a great river in the desert plains.','هذه المدينة في الشرق، على ضفاف نهر عظيم في سهول صحراوية.'],['It stands on the Euphrates, downstream from Raqqa.','تقع على نهر الفرات، جنوب شرق الرقة.']],['Deir ez-Zor is Syria’s main city on the Euphrates, the longest river in western Asia.','دير الزور أكبر مدينة سورية على نهر الفرات، أطول أنهار غرب آسيا.']),
 city('bosra',32.5183,36.4811,'🎭',['Bosra','بصرى'],[['This ancient town is in the far south, close to the Jordanian border, on a volcanic plain.','هذه البلدة القديمة في أقصى الجنوب، قرب الحدود الأردنية، على سهل بركاني.'],['Its black basalt Roman theatre is remarkably well preserved.','مسرحها الروماني من البازلت الأسود محفوظ بشكل لافت.']],['Bosra’s Roman theatre is built of black basalt, seats about 15,000 people, and is still used for concerts.','بُني مسرح بصرى الروماني من البازلت الأسود ويتّسع لنحو 15 ألف متفرج، ولا يزال يُستخدم للحفلات.']),
 city('qamishli',37.0500,41.2200,'🚂',['Qamishli','القامشلي'],[['This city is in the far northeast, right on the Turkish border.','هذه المدينة في أقصى الشمال الشرقي، على الحدود التركية مباشرة.'],['It grew around a railway in the 1920s and is famously multicultural.','نمت حول سكة حديد في عشرينيات القرن الماضي، وتشتهر بتنوعها الثقافي.']],['Qamishli grew around a railway line in the 1920s and is home to Arabs, Kurds, Syriacs and Armenians.','نمت القامشلي حول خط سكة حديد في عشرينيات القرن الماضي، ويعيش فيها عرب وأكراد وسريان وأرمن.'])]},
ps:{id:'ps',n:['Palestine','فلسطين'],tg:['Land of Olives','بلد الزيتون'],coast:PCOAST,land:PLAND,seas:[MED,GULF],lakes:[DEAD,GAL],rivers:[JRIV],g:[[0,'#d3dca8'],[.5,'#e6dcae'],[1,'#efd9a2']],gd:[0,0,0,1],cur:{n:['Palestine Pound','جنيه فلسطيني'],v:25},th:['#380d11','#a82a31'],
 cities:[
 city('jerusalem',31.7683,35.2137,'🕌',['Jerusalem','القدس'],[['This city sits in the central hills, about 55 km inland from the Mediterranean.','تقع هذه المدينة في التلال الوسطى، على بعد نحو 55 كم من المتوسط.'],['It holds the Dome of the Rock and the Church of the Holy Sepulchre.','فيها قبة الصخرة وكنيسة القيامة.']],['Jerusalem’s Old City packs sites sacred to Muslims, Christians and Jews into less than one square kilometre.','تضم القدس القديمة مواقع مقدسة للمسلمين والمسيحيين واليهود في أقل من كيلومتر مربع واحد.']),
 city('gaza',31.5017,34.4668,'🌊',['Gaza','غزة'],[['This coastal city is in the far southwest, near the edge of the Sinai.','هذه المدينة الساحلية في أقصى الجنوب الغربي، قرب حافة سيناء.'],['It is one of the world’s oldest ports, on the ancient Via Maris.','هي من أقدم موانئ العالم، على طريق «فيا ماريس» القديم.']],['Gaza has been a port on the Mediterranean for over 3,000 years, on the old Via Maris trade route between Egypt and the north.','كانت غزة مرفأً على المتوسط منذ أكثر من 3000 عام، على طريق «فيا ماريس» التجاري القديم بين مصر والشمال.']),
 city('jaffa',32.0545,34.7522,'🍊',['Jaffa','يافا'],[['This ancient port is on the central Mediterranean coast.','هذا الميناء القديم على الساحل المتوسطي الأوسط.'],['It gave its name to a world-famous orange.','أعطى اسمه لبرتقال مشهور عالميًا.']],['Jaffa’s port is thousands of years old, and Jaffa oranges (Shamouti), famous for their thick skins, were exported worldwide.','مرفأ يافا عمره آلاف السنين، وبرتقال يافا (الشموطي) الشهير بقشرته السميكة صُدّر إلى العالم.']),
 city('haifa',32.7940,34.9896,'⛰️',['Haifa','حيفا'],[['This city is on the northern coast, on a mountain beside a big bay.','هذه المدينة على الساحل الشمالي، فوق جبل بجانب خليج واسع.'],['It climbs the slopes of Mount Carmel and is a major port.','تتسلق سفوح جبل الكرمل وهي ميناء رئيسي.']],['Haifa climbs the slopes of Mount Carmel above a large bay, and is a major port.','تتسلق حيفا سفوح جبل الكرمل فوق خليج واسع، وهي ميناء رئيسي.']),
 city('nazareth',32.6996,35.3035,'⛪',['Nazareth','الناصرة'],[['This hill town is in the Galilee in the north, inland from the coast.','هذه البلدة التلّية في الجليل شمالًا، بعيدًا عن الساحل.'],['It is the traditional home of Jesus’s childhood.','هي موطن طفولة يسوع التقليدي.']],['Nazareth is traditionally the town where Jesus grew up; the Basilica of the Annunciation is its landmark.','تُعرف الناصرة تقليديًا بأنها البلدة التي نشأ فيها يسوع، ومعلمها كنيسة البشارة.']),
 city('nablus',32.2211,35.2544,'🍮',['Nablus','نابلس'],[['This city lies in the northern hills, in a valley between two mountains.','تقع هذه المدينة في التلال الشمالية، في وادٍ بين جبلين.'],['It is famous for knafeh and olive-oil soap.','تشتهر بالكنافة وصابون الزيت.']],['Nablus is famous for knafeh sweets and for olive-oil soap that has been made there for centuries.','تشتهر نابلس بالكنافة وبصابون الزيت الذي يُصنع فيها منذ قرون.']),
 city('hebron',31.5326,35.0998,'🍇',['Hebron','الخليل'],[['This hill city is in the south of the central highlands, among vineyards, high above sea level.','هذه المدينة الجبلية في جنوب المرتفعات الوسطى، بين الكروم، على ارتفاع شاهق.'],['It is famous for grapes, glass and pottery.','تشتهر بالعنب والزجاج والفخار.']],['Hebron is known for its grapes, glassblowing and pottery, and for the Ibrahimi Mosque.','تشتهر الخليل بالعنب وصناعة الزجاج والفخار وبالحرم الإبراهيمي.']),
 city('jericho',31.8667,35.4500,'🌴',['Jericho','أريحا'],[['This oasis lies in the east, in the Jordan Valley close to the Dead Sea.','تقع هذه الواحة في الشرق، في غور الأردن قرب البحر الميت.'],['It is often called the lowest city on Earth.','يُقال إنها أخفض مدينة على وجه الأرض.']],['Jericho lies about 250 m below sea level and is often called the lowest and one of the oldest cities in the world.','تقع أريحا نحو 250 مترًا تحت مستوى سطح البحر، وغالبًا ما تُوصف بأنها أخفض مدينة وأحد أقدم مدن العالم.'])]},

 box.style.transition='none';box.style.opacity=1;box.classList.remove('hidden');cap.style.opacity=0;cap.classList.remove('last');cap.style.letterSpacing=L==='ar'?'0':'';
 function finish(fast){if(fin)return;fin=1;cancelAnimationFrame(raf);tm.forEach(clearTimeout);removeEventListener('resize',sz);box.style.transition=`opacity ${fast?.4:1}s ease`;box.style.opacity=0;cb();setTimeout(()=>box.classList.add('hidden'),fast?450:1100)}
 $('#skip').onclick=()=>finish(true);
 const lonC=c.lonC,latC=c.latC,T=5600,cl=x=>Math.max(0,Math.min(1,x)),sm=x=>x*x*(3-2*x);
 const stars=Array.from({length:180},()=>[Math.random(),Math.random(),Math.random()*1.3+.3]);
 const caps=[[0,t('c1')],[2100,t('c2')],[3800,c.n[li()]]];
 let ci=-1;const t0=performance.now();
 tm.push(setTimeout(()=>{box.style.transition='opacity 1s ease';box.style.opacity=0},5100),setTimeout(cb,5450),setTimeout(()=>finish(false),6400));
 function frame(now){
  const e=now-t0,tt=Math.min(1,e/T),rot=sm(cl(tt/.85)),zp=sm(cl((tt-.28)/.67)),
   ds=Math.min(W/BASE.w,H/BASE.h),R0=Math.min(W,H)*.3,R1=K*ds*57.2958,R=R0*Math.pow(R1/R0,zp),
   lon0=-40+(lonC+40)*rot,lat0=12+(latC-12)*rot,sp=Math.sin(lat0*RD),cp=Math.cos(lat0*RD),cx=W/2,cy=H/2;
  const pr=(lo,la)=>{const l=(lo-lon0)*RD,f=la*RD,cf=Math.cos(f),cc=sp*Math.sin(f)+cp*cf*Math.cos(l);let x=R*cf*Math.sin(l),y=-R*(cp*Math.sin(f)-sp*cf*Math.cos(l));if(cc<0){const m=Math.hypot(x,y)||1;x*=R/m;y*=R/m}return[cx+x,cy+y]};
  const clipP=(a,x0,y0,x1,y1)=>{let o=a;const ed=[[p=>p[0]>=x0,(p,q)=>[x0,p[1]+(q[1]-p[1])*(x0-p[0])/(q[0]-p[0])]],[p=>p[0]<=x1,(p,q)=>[x1,p[1]+(q[1]-p[1])*(x1-p[0])/(q[0]-p[0])]],[p=>p[1]>=y0,(p,q)=>[p[0]+(q[0]-p[0])*(y0-p[1])/(q[1]-p[1]),y0]],[p=>p[1]<=y1,(p,q)=>[p[0]+(q[0]-p[0])*(y1-p[1])/(q[1]-p[1]),y1]]];
   for(const[ins,ix]of ed){const r=[];for(let i=0;i<o.length;i++){const p=o[i],q=o[(i+1)%o.length],u=ins(p),v=ins(q);if(u)r.push(p);if(u!==v)r.push(ix(p,q))}o=r;if(!o.length)break}return o};
  const path=a=>{const o=clipP(a.map(q=>pr(q[0],q[1])),-300,-300,W+300,H+300);if(o.length<3)return false;g.beginPath();o.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();return true};
  let k=0;caps.forEach((cc,i)=>{if(e>=cc[0])k=i});
  if(k!==ci){ci=k;cap.style.opacity=0;tm.push(setTimeout(()=>{cap.textContent=caps[k][1];cap.classList.toggle('last',k===2);cap.style.opacity=1},350))}
  if(e>4900)cap.style.opacity=0;
  const sg=g.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H));sg.addColorStop(0,'#0a1236');sg.addColorStop(1,'#01020a');g.fillStyle=sg;g.fillRect(0,0,W,H);
  g.fillStyle='#fff';stars.forEach(s=>{g.globalAlpha=(.4+.6*Math.sin(e/500+s[0]*20)**2)*(1-zp);g.fillRect(s[0]*W,s[1]*H,s[2],s[2])});g.globalAlpha=1;
  const big=R>Math.max(W,H)*2,gr=Math.min(R,Math.max(W,H)*2);
  if(!big){const ag=g.createRadialGradient(cx,cy,R*.97,cx,cy,R*1.16);ag.addColorStop(0,'rgba(110,180,255,.6)');ag.addColorStop(1,'rgba(110,180,255,0)');g.fillStyle=ag;g.fillRect(0,0,W,H)}
  g.save();if(!big){g.beginPath();g.arc(cx,cy,R,0,6.2832);g.clip()}
  const og=g.createRadialGradient(cx-gr*.35,cy-gr*.35,gr*.05,cx,cy,gr*1.05);og.addColorStop(0,'#3d9be0');og.addColorStop(.6,'#1457a8');og.addColorStop(1,'#06224f');g.fillStyle=og;g.fillRect(0,0,W,H);
  g.fillStyle=`rgba(70,170,215,${.85*zp})`;g.fillRect(0,0,W,H);
  g.lineJoin='round';g.lineWidth=Math.min(40,Math.max(1.5,R*.006));g.strokeStyle='rgba(150,235,240,.4)';
  const lc=(a,b)=>Math.round(a+(b-a)*zp);
  LAND_P.forEach(p=>{if(path(p))g.stroke()});
  g.fillStyle=`rgb(${lc(78,214)},${lc(142,196)},${lc(80,148)})`;LAND_P.forEach(p=>{if(path(p))g.fill()});
  g.fillStyle=`rgb(${lc(30,60)},${lc(95,160)},${lc(165,210)})`;WATER_P.forEach(p=>{if(path(p))g.fill()});
  if(!big){const lg=g.createRadialGradient(cx,cy,R*.55,cx,cy,R);lg.addColorStop(0,'rgba(0,10,40,0)');lg.addColorStop(1,'rgba(0,10,40,.6)');g.fillStyle=lg;g.fillRect(0,0,W,H)}
  g.restore();
  const m=pr(lonC,latC),pa=cl(tt/.2)*(1-sm(cl((zp-.5)/.3)));
  if(pa>0){const ph=(e%1100)/1100;g.globalAlpha=pa;g.fillStyle='#ed1c24';g.beginPath();g.arc(m[0],m[1],5,0,6.2832);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(m[0],m[1],8+ph*26,0,6.2832);g.globalAlpha=pa*(1-ph);g.stroke();g.globalAlpha=1}
  if(!fin&&e<6400)raf=requestAnimationFrame(frame)}
 raf=requestAnimationFrame(frame)}

/* ================= game ================= */
let G={phase:'intro',deck:[],i:0,found:0,pin:null,guess:null,done:[],over:false,h:0};
const cur=()=>G.deck[G.i];
function pinAt(x,y,col,cls){const m=M(fx,x,y);const g=E('g',{class:cls},m.g);E('path',{d:'M0 0C-12-14-16-22-16-30a16 16 0 0 1 32 0C16-22 12-14 0 0Z',fill:col,stroke:'#fff','stroke-width':3},g);E('circle',{cy:-30,r:6,fill:'#fff'},g);return m}
function toast(s){const e=$('#toast');e.textContent=s;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
function drawDone(){dn.innerHTML='';ms=ms.filter(m=>!m.done);if(!CC)return;
 G.done.forEach(c=>{const m=M(dn,X(c.lo),Y(c.la),G.over?1.5:1);m.done=1;E('circle',{r:6,fill:'#00a651',stroke:'#fff','stroke-width':2.5},m.g);
  const tx=E('text',{class:'lbl',x:L==='ar'?-10:10,y:-9,'text-anchor':L==='ar'?'end':'start'},m.g);tx.textContent=c.n[li()]})}
function tap(cx,cy){if(G.phase!=='guess')return;const p=toS(cx,cy);
 if(!inPoly(pts,p.x,p.y)||lakePts.some(l=>inPoly(l,p.x,p.y))){toast(t('outside'));svg.classList.remove('shake');void svg.getBoundingClientRect();svg.classList.add('shake');return}
 if(G.pin)rm(G.pin);G.pin=pinAt(p.x,p.y,'#ed1c24','pinp');G.guess=p;$('#lock').disabled=false;sfx('pin')}

function setPhase(p){G.phase=p;
 const on=(s,v)=>$(s).classList.toggle('hidden',!v),g=p==='guess',r=p==='reveal',inGame=g||r||p==='finale'||p==='end';
 on('#intro',p==='intro');on('#select',p==='select');on('#splash',p==='splash');
 on('#hud',inGame);on('#timer',g);on('#chal',g||r);on('#zoom',g||r||p==='end');on('#acts',g||r);on('#fact',r);on('#end',p==='end');
 on('#lock',g);on('#next',r);on('#bC',inGame||p==='splash');on('#frame',inGame||p==='splash');
 svg.style.opacity=(p==='intro'||p==='select')?0:1;
 theme((p==='intro'||p==='select')?'lv':CC.id);render()}
function render(){
 document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
 $('#lang').textContent=t('other');$('#bC').textContent='☰ '+t('countries');
 $('#selT').textContent=t('pick');$('#selP').textContent=t('pickSub');
 $('#cards').innerHTML=IDS.map((id,i)=>{const c=CT[id];return `<button class="cc" data-id="${id}" style="--k1:${c.th[0]};--k2:${c.th[1]};animation-delay:${i*.1}s"><div class="fl">${flag(id)}</div><svg class="mo" viewBox="0 0 160 120"><use href="#m-${id}"/></svg><div class="ttl nm">${c.n[li()]}</div><div class="tg">${c.tg[li()]}</div></button>`}).join('');
 $$('.cc').forEach(b=>b.onclick=()=>chooseCountry(b.dataset.id));
 if(CC){$('#spf').innerHTML=flag(CC.id);$('#spn').textContent=CC.n[li()];$('#spt').textContent=CC.tg[li()];$('#spr').textContent=t('rules');$('#begin').textContent=t('begin');
  $('#rd').textContent=`${t('round')} ${Math.min(G.i+1,8)}/8`;$('#sc').textContent=`⭐ ${G.found}`;
  $('#lock').textContent=t('lock');$('#next').textContent=G.i===7?t('res'):t('next');$('#cfind').textContent=t('find');$('#cfl').innerHTML=flag(CC.id);
  const c=cur();if(c){$('#cn').textContent=c.n[li()];renderHints()}
  if(G.phase==='reveal')fillFact();if(G.phase==='end')fillEnd();drawDone()}}
function renderHints(){const c=cur();if(!c)return;$('#hints').innerHTML=c.h.slice(0,G.h).map(h=>`<li>💡 ${h[li()]}</li>`).join('');const b=$('#hintBtn');b.textContent=G.h>=2?t('noHints'):`💡 ${t('hint')} (${2-G.h})`;b.disabled=G.h>=2}
$('#hintBtn').onclick=()=>{if(G.phase!=='guess'||G.h>=2)return;G.h++;renderHints();sfx('lock')};

/* navigation */
$('#go').onclick=()=>{actx();playTrack('lev');setPhase('select')};
$('#bC').onclick=()=>toCountries();
function toCountries(){clearInterval(G.iv);clearTimeout(G.fin1);clearTimeout(G.fin2);$('#cheer').classList.add('hidden');G.phase='select';fx.innerHTML='';dn.innerHTML='';ms=[];playTrack('lev');setPhase('select')}

 $$('.cc').forEach(b=>b.classList.toggle('sel',b.dataset.id===id));$('#cards').classList.add('pick');
 setTimeout(()=>{$('#cards').classList.remove('pick');setProj(CT[id]);buildWorld(CC);fx.innerHTML='';dn.innerHTML='';ms=[];setVB(BASE);
  G={phase:'cinema',deck:[...CC.cities].sort(()=>Math.random()-.5),i:0,found:0,pin:null,guess:null,done:[],over:false,h:0};
  ['intro','select','splash','hud','timer','chal','zoom','fact','end','acts','frame'].forEach(s=>$('#'+s).classList.add('hidden'));svg.style.opacity=1;theme(id);
  cinema(CC,()=>setPhase('splash'))},650)}
$('#begin').onclick=()=>{round()};
function round(){fx.innerHTML='';ms=ms.filter(m=>m.done);G.pin=null;G.guess=null;G.h=0;$('#lock').disabled=true;$('#hints').innerHTML='';fly(BASE,700);setPhase('guess');startTimer()}
function startTimer(){clearInterval(G.iv);G.t0=performance.now();G.ls=99;$('#timer').classList.remove('low');
 G.iv=setInterval(()=>{const left=Math.max(0,TIME-(performance.now()-G.t0)/1000),s=Math.ceil(left);$('#tn').textContent=s;$('#tb').style.width=(left/TIME*100)+'%';$('#timer').classList.toggle('low',left<=10);

$('#lock').onclick=()=>{if(G.pin)lock(false)};
function lock(to){clearInterval(G.iv);const c=cur(),tx=X(c.lo),ty=Y(c.la),g=G.pin?G.guess:null;
 G.d=null;G.hit=false;
 if(g){const la=CC.lat1-g.y/K,lo=g.x/(C*K)+CC.lon0;G.d=hav(la,lo,c.la,c.lo);G.hit=G.d<=HIT_KM;E('line',{class:'line',x1:g.x,y1:g.y,x2:tx,y2:ty},fx)}

 else{E('circle',{class:'ring',r:8,cx:0,cy:-2},m.g);if(G.pin)G.pin.g.firstChild.classList.add('wob');sfx(g?'no':'lock')}

function fillFact(){const c=cur(),d=G.d,v=d===null?['no',t('nog')]:d<=HIT_KM?['ok',t('ok')]:d<=80?['no',t('near')]:['no',t('no')];
 const dl=d===null?'':t('d').replace('{d}',d.toFixed(d<10?1:0))+' · ';
 $('#fact').innerHTML=`<div class="tile" style="background:linear-gradient(135deg,${CC.th[0]},${CC.th[1]})"><span>${c.e}</span><img src="img/${c.id}.jpg" alt="" onerror="this.remove()"></div>

$('#next').onclick=()=>{fx.innerHTML='';ms=ms.filter(m=>m.done);G.pin=null;
 if(G.i<7){G.done.push(cur());G.i++;round()}
 else{fly(BASE,1400);setPhase('finale');$('#cheerT').textContent=t('cheer');const ch=$('#cheer');ch.classList.remove('hidden');confetti();sfx('fin');
  G.fin1=setTimeout(()=>{dn.style.transition='opacity .5s';dn.style.opacity=0},2800);
  G.fin2=setTimeout(()=>{ch.classList.add('hidden');if(G.phase!=='finale')return;G.done.push(cur());G.over=true;setPhase('end');dn.style.transition='opacity 1.3s';requestAnimationFrame(()=>requestAnimationFrame(()=>dn.style.opacity=1))},3400)}};
function fillEnd(){const s=G.found,m=S[L].m[s>=8?4:s>=6?3:s>=4?2:s>=2?1:0],cu=CC.cur;
 const stack=Array.from({length:s},(_,i)=>`<img src="${NOTE[CC.id]}" alt="" style="left:${i*12}px;top:${(i%2)*4}px;z-index:${i};transform:rotate(${(i%2?1:-1)*(1+i%3)}deg);animation-delay:${i*.12}s">`).join('');
 $('#end').innerHTML=`<div class="fb" style="text-align:center"><div class="bignum">${s}<small>/8</small></div><div class="dist">${t('of')}</div><p style="margin:8px 0 10px;font-weight:700">${m}</p>
 <div class="did">${t('prize')}</div>${s?`<div class="stack">${stack}</div><div class="ntv" style="font-size:1.1rem">${t('total')}: ${s*cu.v} ${cu.n[li()]}</div><div style="font-size:.78rem;opacity:.7;margin-top:2px">${t('booth')}</div>`:`<p>${t('none')}</p>`}
 <div style="display:flex;flex-direction:column;gap:8px;margin-top:14px"><button class="btn" id="again">${t('again')}</button><button class="btn alt" id="another">${t('another')}</button></div></div>`;
 $('#again').onclick=()=>{setPhase('select');chooseCountry(CC.id)};$('#another').onclick=toCountries}
function confetti(){const c=$('#conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#ed1c24','#ffffff','#00a651','#ffc93c','#2a8fd0'];
 const ps=Array.from({length:120},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,r:5+Math.random()*7,v:2+Math.random()*3.5,s:Math.random()*2-1,a:Math.random()*6,c:cols[Math.random()*5|0]}));
 let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.a+=.06)*1.5+p.s;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*.6)});if(++f<760)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)})()}

 const P=a=>D(a.map(([lo,la])=>[(lo-lo0)*c*k,(la1-la)*k])),col={lb:'#2f9e5a',sy:'#3a6fc4',ps:'#d6414a',jo:'#e0803a'};
 $('#imap').setAttribute('viewBox',`0 0 ${w} ${h}`);
 $('#imap').innerHTML=`<defs><linearGradient id="isg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f3b86"/><stop offset="1" stop-color="#2b8fcf"/></linearGradient><linearGradient id="ilg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c79b"/><stop offset="1" stop-color="#c3a870"/></linearGradient></defs>
 <rect width="${w}" height="${h}" fill="url(#ilg)"/><path d="${P(MED)}Z" fill="url(#isg)"/><path d="${P(GULF)}Z" fill="url(#isg)"/>
 ${IDS.map((id,i)=>`<path class="cn1" d="${P(ring(CT[id]))}Z" fill="${col[id]}" stroke="#fff" stroke-width="2" stroke-linejoin="round" style="animation-delay:${.3+i*.25}s"/>`).join('')}
 ${[DEAD,GAL].map(l=>`<path d="${P(l)}Z" fill="#59b4de"/>`).join('')}`}

/* ================= boot ================= */
symbols();introMap();theme('lv');corners($('#intro'),'lv');corners($('#select'),'lv');
IDS.forEach(id=>fetch('geo/'+id+'.geojson').then(r=>r.ok?r.json():Promise.reject()).then(g=>{const f=g.type==='FeatureCollection'?g.features[0].geometry:(g.geometry||g);const rs=f.type==='Polygon'?[f.coordinates[0]]:f.coordinates.map(p=>p[0]);CT[id].ring=rs.sort((a,b)=>b.length-a.length)[0].map(p=>[p[0],p[1]])}).catch(()=>{}));
render();
